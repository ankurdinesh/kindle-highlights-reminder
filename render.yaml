services:
  # Backend API (Free Tier)
  - type: web
    name: kindle-highlights-backend
    runtime: node
    env: node
    plan: free  # Free tier - spins down after 15 min inactivity
    region: oregon
    buildCommand: cd backend && npm ci --include=dev && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_VERSION
        value: "22.23.4"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: kindle-highlights-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ALLOWED_ORIGINS
        sync: false # Set this in Render dashboard

  # Frontend (Free Static Site)
  - type: web
    name: kindle-highlights-frontend
    runtime: static
    env: static
    buildCommand: cd daily-highlight && npm install && npm run build
    staticPublishPath: ./daily-highlight/dist
    envVars:
      - key: NODE_VERSION
        value: "22.23.4"
      - key: VITE_API_URL
        value: https://kindle-highlights-backend.onrender.com/api

# Database (Free Tier - 1GB storage, 90 days expiry)
databases:
  - name: kindle-highlights-db
    databaseName: kindle_highlights
    user: kindle_user
    region: oregon
    plan: free
